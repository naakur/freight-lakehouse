resources:
  jobs:

    # ---- Run ONCE per environment: creates schemas, volume, folders, ops tables.
    setup_environment:
      name: freight_setup_environment_${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup_environment.py
            base_parameters:
              catalog: ${var.catalog}
              src_path: ${workspace.file_path}/src/freight_etl
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

    # ---- Batch flow:  validate files -> Auto Loader pipeline -> audit/reconcile
    batch_ingest:
      name: freight_batch_ingest_${bundle.target}
      max_concurrent_runs: 1
      # email_notifications:            # add later (Step 9)
      #   on_failure: [you@example.com]
      tasks:
        - task_key: preflight_validate_files
          notebook_task:
            notebook_path: ../notebooks/01_preflight_validate_files.py
            base_parameters:
              catalog: ${var.catalog}
              run_id: "{{job.run_id}}"
              src_path: ${workspace.file_path}/src/freight_etl

        - task_key: run_batch_pipeline
          depends_on:
            - task_key: preflight_validate_files
          pipeline_task:
            pipeline_id: ${resources.pipelines.freight_batch_pipeline.id}

        - task_key: audit_and_reconcile
          depends_on:
            - task_key: run_batch_pipeline
          notebook_task:
            notebook_path: ../notebooks/90_audit_and_reconcile.py
            base_parameters:
              catalog: ${var.catalog}
              run_id: "{{job.run_id}}"
              src_path: ${workspace.file_path}/src/freight_etl

        - task_key: audit_cdc
          depends_on:
            - task_key: audit_and_reconcile
          notebook_task:
            notebook_path: ../notebooks/92_audit_cdc.py
            base_parameters:
              catalog: ${var.catalog}
              run_id: "{{job.run_id}}"
              src_path: ${workspace.file_path}/src/freight_etl
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

    # ---- Kafka flow:  stream pipeline -> audit/reconcile
    stream_ingest:
      name: freight_stream_ingest_${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: run_stream_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.freight_stream_pipeline.id}

        - task_key: audit_stream
          depends_on:
            - task_key: run_stream_pipeline
          notebook_task:
            notebook_path: ../notebooks/91_audit_stream.py
            base_parameters:
              stream_source: ${var.stream_source}
              catalog: ${var.catalog}
              run_id: "{{job.run_id}}"
              src_path: ${workspace.file_path}/src/freight_etl
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

    # ---- Gold flow: build gold -> audit gold (row counts, money totals, audit rules vs ground truth)
    gold_build:
      name: freight_gold_build_${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: run_gold_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.freight_gold_pipeline.id}

        - task_key: audit_gold
          depends_on:
            - task_key: run_gold_pipeline
          notebook_task:
            notebook_path: ../notebooks/93_audit_gold.py
            base_parameters:
              catalog: ${var.catalog}
              run_id: "{{job.run_id}}"
              src_path: ${workspace.file_path}/src/freight_etl
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

    # ---- The whole platform in one click: batch + stream in parallel, then gold
    freight_end_to_end:
      name: freight_end_to_end_${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: batch_ingest
          run_job_task:
            job_id: ${resources.jobs.batch_ingest.id}
        - task_key: stream_ingest
          run_job_task:
            job_id: ${resources.jobs.stream_ingest.id}
        - task_key: gold_build
          depends_on:
            - task_key: batch_ingest
            - task_key: stream_ingest
          run_job_task:
            job_id: ${resources.jobs.gold_build.id}
