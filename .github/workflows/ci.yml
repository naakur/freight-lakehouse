# CI: runs on every pull request. Nothing is deployed to prod from here.
#   1. lint        2. unit + logic tests (local Spark)        3. secret scan        4. bundle validate for all targets
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Generate the sample dataset (reproducible, seed 42)
        run: python data_generator/generate_freight_data.py --shipments 3000 --seed 42 --out data
      - name: Tests (rules, CDC, gold logic vs ground truth, bundle config)
        env:
          FREIGHT_DATA_DIR: ${{ github.workspace }}/data/batch
          FREIGHT_STREAM_DIR: ${{ github.workspace }}/data/stream
        run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: test          # holds DATABRICKS_HOST / DATABRICKS_TOKEN (validate needs to talk to the workspace)
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        with:
          version: 0.299.2
      - name: Validate every target
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t test
          databricks bundle validate -t prod
